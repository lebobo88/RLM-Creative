name: "Creative & Production — Eight Garland Heads"
version: 1.0.0
deprecated_after: null
description: >
  Eight Garland Heads crew (Calliope, Erato, Polyhymnia, Terpsichore, Euterpe, Clio,
  Urania, Helios) plus seven Helios sub-agents (video-synth, audio-foley, music-score,
  dialogue-mix, blender-model, blender-rig, governance-c2pa). Replaces the generic
  Creative & Production squad. Wired to the RLM-Creative source pack and the Hydra orchestrator.
source_pack: .
entrypoint: claude-skill
industries:
  - media
  - marketing
  - advertising
  - film
  - livestream
  - creator-economy

agents:
  # Crew heads
  - slug: brand-strategist
    mythic: Calliope
    role: "Brand Strategist — Crew Lead"
    authority: gatekeeper
    model_tier: opus
    agent_file: plugins/rlm-creative/agents/calliope.md

  - slug: copywriter
    mythic: Erato
    role: "Copywriter"
    authority: execute
    model_tier: sonnet
    agent_file: plugins/rlm-creative/agents/erato.md

  - slug: content-strategist
    mythic: Polyhymnia
    role: "Content Strategist"
    authority: execute
    model_tier: sonnet
    agent_file: plugins/rlm-creative/agents/polyhymnia.md

  - slug: social-community
    mythic: Terpsichore
    role: "Social & Community"
    authority: execute
    model_tier: sonnet
    agent_file: plugins/rlm-creative/agents/terpsichore.md

  - slug: paid-acquisition
    mythic: Euterpe
    role: "Paid Acquisition"
    authority: execute
    model_tier: sonnet
    agent_file: plugins/rlm-creative/agents/euterpe.md

  - slug: pr-earned
    mythic: Clio
    role: "PR & Earned Media"
    authority: execute
    model_tier: sonnet
    agent_file: plugins/rlm-creative/agents/clio.md

  - slug: seo-discovery
    mythic: Urania
    role: "SEO & Discovery"
    authority: execute
    model_tier: sonnet
    agent_file: plugins/rlm-creative/agents/urania.md

  - slug: photo-cinema
    mythic: Helios
    role: "Photo & Cinema — Sub-Crew Lead"
    authority: gatekeeper
    model_tier: opus
    agent_file: plugins/rlm-creative/agents/helios.md

  # Helios sub-agents
  - slug: video-synth
    parent: photo-cinema
    role: "Video Synthesis"
    authority: execute
    model_tier: haiku
    agent_file: plugins/rlm-creative/agents/helios-crew/video-synth.md

  - slug: audio-foley
    parent: photo-cinema
    role: "Audio Foley & SFX"
    authority: execute
    model_tier: haiku
    agent_file: plugins/rlm-creative/agents/helios-crew/audio-foley.md

  - slug: music-score
    parent: photo-cinema
    role: "Music Score"
    authority: execute
    model_tier: haiku
    agent_file: plugins/rlm-creative/agents/helios-crew/music-score.md

  - slug: dialogue-mix
    parent: photo-cinema
    role: "Dialogue Mix"
    authority: execute
    model_tier: haiku
    agent_file: plugins/rlm-creative/agents/helios-crew/dialogue-mix.md

  - slug: blender-model
    parent: photo-cinema
    role: "3D Modeling (Blender)"
    authority: execute
    model_tier: sonnet
    notes: "Executes mesh ASSET_JOBs (model_type=mesh) on the existing blender-mcp to The Sculptor's dcc_contract; self-checks mesh-topology-budget; signs via governance-c2pa."
    agent_file: plugins/rlm-creative/agents/helios-crew/blender-model.md

  - slug: blender-rig
    parent: photo-cinema
    role: "Rigging & Animation (Blender)"
    authority: execute
    model_tier: sonnet
    notes: "Executes rig ASSET_JOBs (model_type=rig) on the existing blender-mcp to The Choreographer's rig contract; self-checks rig-quality; signs via governance-c2pa."
    agent_file: plugins/rlm-creative/agents/helios-crew/blender-rig.md

  - slug: governance-c2pa
    parent: photo-cinema
    role: "IP Governance & C2PA Signing"
    authority: execute
    model_tier: opus
    hitl_trigger: true
    notes: "HITL required on IP-clearance failure, brand-safety failure, or any asset pending C2PA signing."
    agent_file: plugins/rlm-creative/agents/helios-crew/governance-c2pa.md

tools:
  - name: comfyui
    privilege: execute
    notes: "Callable by Helios and video-synth only. All other agents are prohibited."
  - name: blender
    privilege: execute
    notes: >
      The EXISTING/3rd-party blender-mcp backend (socket :9876 / MCP bridge :7700),
      registered in Hydra hydra_core/gateway_templates.json. Callable by Helios,
      blender-model, and blender-rig ONLY — all other agents prohibited (enforced by
      Helios PreToolUse hook). Garland reuses this server; it does not host Blender.
      Used for: mesh modeling, retopo, UV/PBR, rigging, skinning, retargeting, FBX/glTF/USD export.
  - name: gemini-image
    privilege: execute
  - name: gemini-content
    privilege: execute
  - name: frontend-design
    privilege: advisory
    notes: "Helios may propose landing-page mock-ups; implementation is delegated to the engineering squad."
  - name: marketing-expertise
    privilege: read
  - name: media-business
    privilege: read
  - name: eights-memory
    privilege: read+write
    notes: "All ops require domain='creative' and at least one scope tag."

accepts:
  - CREATIVE_BRIEF
  - SHOT_LIST
  - ASSET_JOB
  - HANDOFF

emits:
  - SHOT_LIST
  - ASSET_JOB
  - DECISION_RECORD

gates:
  - rubric_id: brand-consistency
    when: always
  - rubric_id: ip-clearance
    hitl_required: true
    when: "constraints.risk_tolerance == 'low'"
  - rubric_id: media-cost-cap
    hitl_required: true
    when: "asset_job.max_render_cost_usd > 200"
  - rubric_id: brand-safety
    when: always

invoke:
  command_hint: "/creative-campaign"
  fallback_commands:
    - /photo-direction
    - /brand-refresh
    - /rlm-team
  output_dir: "RLM/output/{phase}/{topic}-{date}.md"
